
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GoalBet - Logout</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f4f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #17202a;
    }

    .logout-card {
      width: 92%;
      max-width: 450px;
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }

    .logo {
      color: #22c55e;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logout-icon {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      background: #fee2e2;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .loading {
      width: 35px;
      height: 35px;
      border: 4px solid #e2e8f0;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button,
    a {
      flex: 1;
      padding: 12px;
      border-radius: 7px;
      border: none;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .home-btn {
      background: #22c55e;
      color: #061b12;
    }

    .login-btn {
      background: #071d35;
      color: white;
    }

    .status {
      color: #16a34a;
      font-size: 14px;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <div class="logout-card">

    <div class="logo">
      ⚽ GoalBet
    </div>

    <div class="logout-icon">
      ✓
    </div>

    <h1>
      Logging Out
    </h1>

    <p>
      Please wait while we securely end your current session.
    </p>

    <div class="loading"></div>

    <div
      id="status"
      class="status"
    >
      Signing you out...
    </div>

    <div
      id="buttons"
      class="buttons"
      style="display:none;"
    >

      <a
        href="index.html"
        class="home-btn"
      >
        Go Home
      </a>

      <a
        href="login.html"
        class="login-btn"
      >
        Login Again
      </a>

    </div>

  </div>


  <script>

    /*
    ========================================
    LOG OUT USER
    ========================================

    The account itself is NOT deleted.

    Only the current login session is removed.

    This means the user can log in again later.
    ========================================
    */

    function logoutUser() {

      /*
      Remove the current session.
      */

      sessionStorage.removeItem(
        "goalbetLoggedIn"
      );


      /*
      If your prototype uses another
      session key, remove it here too.
      */

      sessionStorage.removeItem(
        "goalbetSession"
      );


      /*
      Update the page.
      */

      document.getElementById(
        "status"
      ).textContent =
        "You have been logged out successfully.";


      /*
      Stop the loading animation.
      */

      document.querySelector(
        ".loading"
      ).style.display =
        "none";


      /*
      Show navigation buttons.
      */

      document.getElementById(
        "buttons"
      ).style.display =
        "flex";


      /*
      Automatically return to Home
      after 1.5 seconds.
      */

      setTimeout(function() {

        window.location.href =
          "index.html";

      }, 1500);

    }


    /*
    Run logout automatically
    when the page opens.
    */

    window.addEventListener(
      "DOMContentLoaded",
      function() {

        setTimeout(
          logoutUser,
          800
        );

      }
    );

  </script>

</body>
</html>
